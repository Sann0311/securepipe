name: SecurePipe - DevSecOps Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────
  # JOB 1: SAST — Static Application Security Testing
  # ──────────────────────────────────────────
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: |
          pip install bandit semgrep

      - name: Run Bandit (Python SAST)
        run: |
          bandit -r app/ -f json -o reports/bandit-report.json || true
          bandit -r app/ -f txt
        continue-on-error: false

      - name: Run Semgrep
        run: |
          semgrep --config=auto app/ --json > reports/semgrep-report.json || true
          semgrep --config=auto app/
        continue-on-error: true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: reports/

  # ──────────────────────────────────────────
  # JOB 2: Dependency Scanning
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          mkdir -p reports
          pip-audit -r app/requirements.txt -f json -o reports/pip-audit-report.json || true
          pip-audit -r app/requirements.txt
        continue-on-error: false

      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: reports/pip-audit-report.json

  # ──────────────────────────────────────────
  # JOB 3: Build & Test Docker Image
  # ──────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t securepipe-web ./app

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name test-app securepipe-web
          sleep 5
          curl -f http://localhost:5000/health
          docker stop test-app

  # ──────────────────────────────────────────
  # JOB 4: DAST — Dynamic Application Security Testing
  # ──────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Flask app
        run: |
          docker build -t securepipe-web ./app
          docker run -d -p 5000:5000 --name securepipe-app securepipe-web
          sleep 10
          curl -f http://localhost:5000/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-J reports/zap-report.json"
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: reports/

  # ──────────────────────────────────────────
  # JOB 5: Generate consolidated security summary
  # ──────────────────────────────────────────
  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, dast]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate summary report
        run: python scripts/generate_report.py

      - name: Upload final summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: reports/security-summary.md

      - name: Post summary to GitHub job summary
        run: cat reports/security-summary.md >> $GITHUB_STEP_SUMMARY
